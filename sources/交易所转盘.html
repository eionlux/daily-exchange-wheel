<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>每天一个交易所 · 解说转盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='29'%20fill='%230B0E11'%20stroke='%23F0B90B'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='45'%20font-size='34'%20text-anchor='middle'%20fill='%23F0B90B'%20font-family='sans-serif'%20font-weight='900'%3E%E8%BD%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
  :root{
    --gold:#F0B90B;
    --gold-2:#F8D24A;
    --ink:#E9EEF7;
    --cyan:#22D3EE;
    --panel-w:36%;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#05070E;
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ===== 背景层：深空 + 冷色氛围光 + 点阵 ===== */
  .bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 620px at 78% 26%, rgba(34,211,238,.10), transparent 62%),
      radial-gradient(820px 700px at 6% 88%, rgba(124,58,237,.13), transparent 60%),
      linear-gradient(160deg,#04060D 0%, #070B16 55%, #05070E 100%);
  }
  .bg::after{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 78%);
            mask-image:radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 78%);
  }

  main{
    position:relative; z-index:1;
    display:flex; min-height:100vh; width:100%;
  }

  /* ===== 左侧：竖排大标题 ===== */
  .left{
    width:var(--panel-w);
    padding:7vh 3vw 6vh 5vw;
    display:flex; flex-direction:column; justify-content:center;
    border-right:1px solid rgba(255,255,255,.07);
  }
  .eyebrow{
    display:flex; align-items:center; gap:14px;
    font-size:12px; letter-spacing:.38em; color:var(--cyan); font-weight:700;
  }
  .eyebrow::before{
    content:""; width:26px; height:2px; background:linear-gradient(90deg,var(--cyan),transparent);
  }
  .chars{
    display:flex; flex-direction:column;
    margin:30px 0 0; list-style:none;
    filter:drop-shadow(0 3px 16px rgba(240,185,11,.30));
  }
  .char{
    font-size:clamp(50px, 8.4vh, 94px);
    line-height:1.10; font-weight:900; letter-spacing:.04em;
    color:transparent;
    background:linear-gradient(180deg,#FFF7D6 0%, #F8D24A 46%, #E0960A 100%);
    -webkit-background-clip:text; background-clip:text;
  }
  .divider{
    width:64px; height:2px; margin:28px 0 20px;
    background:linear-gradient(90deg,var(--gold),rgba(240,185,11,.05));
  }
  .desc{
    max-width:280px; font-size:15px; line-height:1.8; color:#9AA7BD; font-weight:400;
  }
  .series{
    margin-top:auto; padding-top:6vh;
    font-size:12px; letter-spacing:.22em; color:#55637E; font-weight:700;
  }

  /* ===== 右侧：半透明转盘 ===== */
  .right{
    flex:1; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:5vh 2vw 4vh;
  }
  .wheel-scene{
    --wheel-size:clamp(300px, 46vmin, 520px);
    position:relative; width:var(--wheel-size); height:var(--wheel-size);
  }
  .wheel{
    position:absolute; inset:0; border-radius:50%;
    background:
      conic-gradient(from 0deg,
        rgba(240,185,11,.52) 0deg 45deg,
        rgba(148,163,184,.52) 45deg 90deg,
        rgba(47,107,255,.52) 90deg 135deg,
        rgba(56,189,248,.52) 135deg 180deg,
        rgba(251,146,60,.52) 180deg 225deg,
        rgba(34,197,94,.52) 225deg 270deg,
        rgba(168,85,247,.52) 270deg 315deg,
        rgba(88,66,255,.52) 315deg 360deg);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.09),
      inset 0 0 70px rgba(0,0,0,.42),
      0 26px 90px rgba(0,0,0,.55);
    transition:transform 4.6s cubic-bezier(.12,.78,.16,1);
    will-change:transform;
    z-index:1;
  }
  .wheel::before{ /* 外圈金环 */
    content:""; position:absolute; inset:-8px; border-radius:50%;
    border:2px solid rgba(240,185,11,.38);
    box-shadow:0 0 26px rgba(240,185,11,.20), inset 0 0 18px rgba(240,185,11,.10);
  }
  .ring{ /* 内侧装饰环 */
    position:absolute; inset:14%; border-radius:50%;
    border:1px dashed rgba(255,255,255,.12); pointer-events:none; z-index:2;
  }
  .sector{ position:absolute; inset:0; z-index:1; }
  .sector-inner{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--wheel-size) * -0.315));
    display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .badge{
    width:clamp(34px, 4.2vw, 46px); aspect-ratio:1; border-radius:26%;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:clamp(13px, 1.7vw, 17px);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .sector.winner .badge{
    animation:pop .55s ease;
    box-shadow:0 0 0 3px var(--gold), 0 0 30px rgba(240,185,11,.85);
  }
  .sector.winner .label{ color:var(--gold); }
  @keyframes pop{
    0%{transform:scale(1)} 45%{transform:scale(1.3)} 100%{transform:scale(1)}
  }
  .label{
    font-size:clamp(10px, 1.15vw, 13px); font-weight:700; letter-spacing:.03em;
    color:#F2F6FF; text-shadow:0 1px 6px rgba(0,0,0,.85); white-space:nowrap;
  }
  /* 品牌占位图标（后续可替换为 assets/icons/ 下的真实 APP 图标） */
  .b1{ background:linear-gradient(160deg,#1C1F26,#0B0E11); color:var(--gold); }
  .b2{ background:linear-gradient(160deg,#2A2F3A,#0A0C10); color:#F5F7FA; }
  .b3{ background:linear-gradient(160deg,#2F6BFF,#0044E0); color:#FFFFFF; }
  .b4{ background:linear-gradient(160deg,#12233D,#0B1220); color:#A6F4FF; }
  .b5{ background:linear-gradient(160deg,#2A1710,#140B06); color:#FB923C; }
  .b6{ background:linear-gradient(160deg,#1E6FD9,#0F4C9E); color:#FFFFFF; }
  .b7{ background:linear-gradient(160deg,#38B6E0,#0E7BB0); color:#FFFFFF; }
  .b8{ background:linear-gradient(160deg,#7A63FF,#4330D6); color:#FFFFFF; }

  .hub{
    position:absolute; left:50%; top:50%; width:21%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%; z-index:3; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,14,24,.74);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border:1px solid rgba(240,185,11,.45);
    box-shadow:0 0 34px rgba(240,185,11,.22), inset 0 0 22px rgba(0,0,0,.55);
    font-size:clamp(20px, 3vw, 30px); font-weight:900; color:var(--gold);
  }
  .pointer{
    position:absolute; left:50%; top:-8px; z-index:4;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:15px solid transparent; border-right:15px solid transparent; border-top:27px solid var(--gold);
    filter:drop-shadow(0 4px 10px rgba(240,185,11,.55));
  }

  .spin-btn{
    margin-top:36px; padding:15px 48px; border-radius:999px;
    background:linear-gradient(180deg,var(--gold-2) 0%,#E3A808 100%);
    color:#181206; font-family:inherit; font-size:17px; font-weight:900; letter-spacing:.14em;
    border:none; cursor:pointer;
    box-shadow:0 12px 32px rgba(240,185,11,.35), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .16s ease, box-shadow .16s ease, opacity .2s;
  }
  .spin-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 16px 40px rgba(240,185,11,.45), inset 0 1px 0 rgba(255,255,255,.55); }
  .spin-btn:active:not(:disabled){ transform:translateY(0); }
  .spin-btn:disabled{ opacity:.65; cursor:wait; }
  .spin-btn:focus-visible{ outline:3px solid rgba(240,185,11,.6); outline-offset:3px; }

  .result{
    margin-top:20px; min-height:36px;
    display:flex; align-items:center; gap:10px;
    padding:9px 20px; border-radius:999px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.13);
    color:#8E9BB2; font-size:14px; letter-spacing:.05em;
  }
  #resultName{ font-weight:800; font-size:16px; }
  .hint{ margin-top:12px; font-size:11px; letter-spacing:.18em; color:#4C5A73; font-weight:700; }

  /* ===== 响应式：窄屏改为上下堆叠 ===== */
  @media (max-width:860px){
    main{ flex-direction:column; }
    .left{
      width:100%; padding:5vh 6vw 2vh;
      border-right:none; align-items:center; text-align:center;
    }
    .eyebrow::before{ display:none; }
    .chars{ flex-direction:row; gap:.32em; margin-top:20px; }
    .char{ font-size:clamp(34px, 9vw, 56px); }
    .divider{ margin:18px auto 14px; }
    .desc{ max-width:none; }
    .series{ margin-top:12px; padding-top:0; }
    .right{ padding:2vh 4vw 6vh; }
    .wheel-scene{ --wheel-size:clamp(280px, 76vmin, 420px); }
  }
  @media (prefers-reduced-motion:reduce){
    .wheel{ transition:none; }
    .badge{ animation:none !important; }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <main>
    <!-- ===== 左侧：每天一个交易所 ===== -->
    <section class="left">
      <div class="eyebrow">视频解说 · 每日一期</div>
      <h1 class="chars" aria-label="每天一个交易所">
        <span class="char">每</span>
        <span class="char">天</span>
        <span class="char">一</span>
        <span class="char">个</span>
        <span class="char">交</span>
        <span class="char">易</span>
        <span class="char">所</span>
      </h1>
      <div class="divider"></div>
      <p class="desc">转动转盘，抽选今天要解说的交易所，一键开始。</p>
      <div class="series">每天一个交易所 · 解说系列</div>
    </section>

    <!-- ===== 右侧：半透明转盘 ===== -->
    <section class="right">
      <div class="wheel-scene">
        <div class="wheel" id="wheel" role="img" aria-label="交易所转盘">
          <!-- 扇区 1-8：角度依次递增 45°，badge 为品牌色占位图标 -->
          <div class="sector">
            <div class="sector-inner" style="--a:22.5deg">
              <span class="badge b1">B</span><span class="label">Binance</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:67.5deg">
              <span class="badge b2">OK</span><span class="label">OKX</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:112.5deg">
              <span class="badge b3">C</span><span class="label">Coinbase</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:157.5deg">
              <span class="badge b4">B</span><span class="label">Bybit</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:202.5deg">
              <span class="badge b5">H</span><span class="label">HTX</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:247.5deg">
              <span class="badge b6">G</span><span class="label">Gate.io</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:292.5deg">
              <span class="badge b7">K</span><span class="label">KuCoin</span>
            </div>
          </div>
          <div class="sector">
            <div class="sector-inner" style="--a:337.5deg">
              <span class="badge b8">Kr</span><span class="label">Kraken</span>
            </div>
          </div>
          <div class="ring"></div>
        </div>
        <div class="hub">转</div>
        <div class="pointer"></div>
      </div>

      <button class="spin-btn" id="spinBtn">开始抽选</button>
      <div class="result">本期话题：<span id="resultName">—</span></div>
      <div class="hint">按空格键快速开始</div>
    </section>
  </main>

<script>
(function(){
  "use strict";

  /* 扇区数据：后续换真实 APP 图标时，仅需把对应 .badge 里的占位字符
     换成 <img src="assets/icons/xxx.png">，并同步此处名称/主题色即可 */
  var SECTORS = [
    { name:"币安 Binance", color:"#F0B90B" },
    { name:"OKX",          color:"#94A3B8" },
    { name:"Coinbase",     color:"#2F6BFF" },
    { name:"Bybit",        color:"#38BDF8" },
    { name:"火币 HTX",     color:"#FB923C" },
    { name:"Gate.io",      color:"#22C55E" },
    { name:"KuCoin",       color:"#A855F7" },
    { name:"Kraken",       color:"#5842FF" }
  ];
  var SECTOR_N = SECTORS.length;         // 8 格
  var SECTOR_ANG = 360 / SECTOR_N;       // 45°
  var SECTORS_DOM = Array.prototype.slice.call(document.querySelectorAll(".sector"));
  var wheel   = document.getElementById("wheel");
  var spinBtn = document.getElementById("spinBtn");
  var resultName = document.getElementById("resultName");

  var current = 0;          // 当前累计旋转角度
  var spinning = false;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DURATION = reduced ? 0 : 4650;

  function spin(){
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = "转动中…";
    SECTORS_DOM.forEach(function(s){ s.classList.remove("winner"); });

    var i = Math.floor(Math.random() * SECTOR_N);            // 目标扇区
    var jitter = Math.random() * 10 - 5;                     // 指针落点 ±5°
    var targetMod = 360 - (i * SECTOR_ANG + SECTOR_ANG / 2 + jitter); // 目标模 360 旋转角
    var turns = 5 + Math.floor(Math.random() * 3);           // 随机 5-7 圈
    var base = Math.floor(current / 360) * 360;
    var next = base + turns * 360 + ((targetMod - (current % 360) + 360) % 360);
    if (next <= current) next += 360;

    current = next;
    wheel.style.transform = "rotate(" + next + "deg)";

    setTimeout(function(){
      SECTORS_DOM[i].classList.add("winner");
      resultName.textContent = SECTORS[i].name;
      resultName.style.color = SECTORS[i].color;
      resultName.style.textShadow = "0 0 14px " + SECTORS[i].color;
      spinBtn.disabled = false;
      spinBtn.textContent = "再来一次";
      spinning = false;
    }, DURATION + 80);
  }

  spinBtn.addEventListener("click", spin);
  wheel.addEventListener("click", spin);          // 点转盘本身也可触发
  document.addEventListener("keydown", function(e){
    if (e.code === "Space" && !e.repeat) { e.preventDefault(); spin(); }
  });
})();
</script>
</body>
</html>
