<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>每天一个交易所 · 系列解说</title>
<style>
:root{color-scheme:dark;--gold:#e8bd59;--line-height:76px;--curve:104px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(ellipse at 77% 49%,#172b39 0,#0c1722 40%,#070b11 78%);color:#f2f5f8;font-family:Inter,"Microsoft YaHei",sans-serif}.grain{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff12 .6px,transparent .6px);background-size:5px 5px;opacity:.25}.layout{height:100%;display:flex;align-items:center}.intro{margin-left:9vw;width:40vw;z-index:2}.intro h1{font-size:clamp(46px,6vw,92px);letter-spacing:.07em;line-height:1.22;margin:0;font-weight:800;background:linear-gradient(130deg,#fff 18%,#d8c391 75%);color:transparent;background-clip:text}.rule{width:86px;height:1px;background:#cfad61;margin-top:32px;opacity:.8}.intro p{margin:24px 0 0;color:#aeb8c5;font-size:15px;letter-spacing:.18em}.edition{font-size:12px;color:#7d8997;letter-spacing:.2em;margin-top:24px}.reel{position:fixed;inset:0 0 0 49%;display:grid;place-items:center;overflow:hidden}.track{position:relative;width:min(48vw,690px);height:min(98vh,960px);mask-image:linear-gradient(transparent 0%,#000 14%,#000 86%,transparent 100%);-webkit-mask-image:linear-gradient(transparent 0%,#000 14%,#000 86%,transparent 100%)}.curve{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.curve path{fill:none;stroke:#d5e9f533;stroke-width:1.5;filter:drop-shadow(0 0 8px #92dfff44)}.curve path.glow{stroke:#e9cd8466;stroke-width:2.5;stroke-dasharray:1 1;opacity:.6}.item{position:absolute;left:50%;top:50%;width:clamp(50px,5.9vw,76px);height:clamp(50px,5.9vw,76px);padding:0;border-radius:50%;border:1px solid #d8e7f244;background:linear-gradient(145deg,#ffffff20,#ffffff08);backdrop-filter:blur(12px);box-shadow:0 8px 24px #0005,inset 0 1px #ffffff28;display:grid;place-items:center;cursor:pointer;transition:transform .28s cubic-bezier(.18,.72,.2,1),opacity .28s,filter .5s,border-color .3s,box-shadow .3s;will-change:transform,opacity}.item img{width:68%;height:68%;object-fit:contain;border-radius:50%}.fallback{font-size:13px;font-weight:800;color:#f4d783}.item.current{width:clamp(90px,10vw,132px);height:clamp(90px,10vw,132px);border:1px solid #f5da91;background:linear-gradient(145deg,#ffffff32,#d6bf8130);box-shadow:0 0 0 8px #e8bd5910,0 0 52px #e8bd5950,inset 0 1px #ffffff66;z-index:4}.item.current img{width:64%;height:64%}.item:hover{border-color:#ffe19b!important;filter:brightness(1.3);z-index:8}.controls{position:fixed;left:9vw;bottom:9vh;z-index:10;display:flex;align-items:center;gap:20px}.spin{border:1px solid #f1d68d99;border-radius:999px;padding:14px 28px;background:linear-gradient(135deg,#e7c66f,#b18a3e);color:#17202a;font:700 14px Inter,"Microsoft YaHei",sans-serif;letter-spacing:.12em;cursor:pointer;box-shadow:0 9px 28px #d4b45c30;transition:filter .2s,transform .2s}.spin:hover{filter:brightness(1.08);transform:translateY(-1px)}.spin:disabled{opacity:.55;cursor:wait}.result{color:#b3bdc8;font-size:14px;letter-spacing:.06em}.result strong{color:#f2d78d;font-size:18px;margin-left:8px}.tip{position:fixed;left:9vw;bottom:5vh;color:#748190;font-size:11px;letter-spacing:.1em;z-index:4}
@media(max-width:760px){body:after{content:"此页面仅适用于电脑端，请在桌面浏览器中打开。";position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:12vw;text-align:center;background:#09111b;color:#e7edf4;font-size:20px;line-height:1.8}.layout,.reel,.controls,.tip,.count{visibility:hidden}}
@media(prefers-reduced-motion:reduce){.item{transition:none}}
</style></head>
<body><div class="grain"></div><main class="layout"><section class="intro"><h1>每天一个<br>交易所</h1><div class="rule"></div><p>系列解说</p><div class="edition">CRYPTO EXCHANGE · DAILY SERIES</div></section></main>
<section class="reel" aria-label="交易所弧形滚动选择器"><div class="track" id="track"></div></section>
<div class="controls"><button class="spin" id="spin">开始抽选</button><div class="result">本期话题<strong id="result">点击图标选择</strong></div></div><div class="tip">点击弧线上可见图标选中；点击“开始抽选”沿曲线滚动抽取</div>
<script>
(()=>{'use strict';
// CoinGecko 当前 Trust Score 榜单前 50（2026-10-06）；徽标在线加载，失败时显示交易所简称。
const exchanges=[
['Coinbase Exchange','coinbase.com'],['Kraken','kraken.com'],['OKX','okx.com'],['Binance','binance.com'],['Bitget','bitget.com'],['Bitstamp','bitstamp.net'],['MEXC','mexc.com'],['Gate','gate.com'],['Crypto.com Exchange','crypto.com'],['Bybit','bybit.com'],['KuCoin','kucoin.com'],['LBank','lbank.com'],['HashKey Exchange','hashkey.com'],['WhiteBIT','whitebit.com'],['Gemini','gemini.com'],['CoinW','coinw.com'],['Toobit','toobit.com'],['Bitunix','bitunix.com'],['Bitkub','bitkub.com'],['Ourbit','ourbit.com'],['Coinstore','coinstore.com'],['Bitvavo','bitvavo.com'],['Bybit EU','bybit.eu'],['BingX','bingx.com'],['Bullish','bullish.com'],['Upbit','upbit.com'],['Luno','luno.com'],['Bitbank','bitbank.cc'],['Zoomex','zoomex.com'],['Bitso','bitso.com'],['Bit2Me','bit2me.com'],['Niza.io','niza.io'],['Binance US','binance.us'],['OSL Exchange','osl.com'],['Bitfinex','bitfinex.com'],['WEEX','weex.com'],['Bitazza','bitazza.com'],['GroveX','grovex.io'],['Bithumb','bithumb.com'],['VALR','valr.com'],['Bitrue','bitrue.com'],['BitKan','bitkan.com'],['Webot','webot.com'],['DigiFinex','digifinex.com'],['Phemex','phemex.com'],['P2B','p2b.com'],['BTSE','btse.com'],['CoinTR','cointr.com'],['Hibt','hibt.com'],['Deepcoin','deepcoin.com']
];
const track=document.querySelector('#track'),result=document.querySelector('#result'),spin=document.querySelector('#spin');const host='https://www.google.com/s2/favicons?domain=';let current=0,busy=false;const buttons=[];let audioCtx;function audio(){if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function soundTick(p){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='triangle';o.frequency.setValueAtTime(760-260*p,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.018,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.035);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.04)}function soundWin(){const c=audio();if(!c)return;[523.25,659.25,783.99].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.32);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.34)})}
function makeItems(){for(let i=0;i<exchanges.length;i++){const [name,domain]=exchanges[i];const b=document.createElement('button');b.className='item';b.setAttribute('aria-label',name);b.title=name+' · 点击选中';const img=document.createElement('img');img.src=host+encodeURIComponent(domain)+'&sz=128';img.alt='';img.onerror=()=>{img.remove();const f=document.createElement('span');f.className='fallback';f.textContent=name.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'EX';b.append(f)};b.append(img);b.addEventListener('click',()=>{if(!busy)setCurrent(i)});track.append(b);buttons.push(b)}render()}
function render(){const h=Math.min(innerHeight*.90,810);const step=Math.min(90,h/9);buttons.forEach((b,i)=>{let d=(i-current+exchanges.length)%exchanges.length;if(d>exchanges.length/2)d-=exchanges.length;const visible=Math.abs(d)<=5;const y=d*step;const t=d/5;const x=-59+80*t*t;const opacity=visible?Math.max(.08,1-Math.abs(d)/6):0;const scale=d===0?1:Math.max(.56,1-Math.abs(d)*.065);b.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;b.style.opacity=opacity;b.style.pointerEvents=visible?'auto':'none';b.style.filter=`blur(${Math.max(0,Math.abs(d)-2)*.35}px)`;b.classList.toggle('current',d===0);b.style.zIndex=String(10-Math.abs(d))})}
function setCurrent(i){current=(i+exchanges.length)%exchanges.length;render();result.textContent=exchanges[current][0]}
function choose(){if(busy)return;audio();busy=true;spin.disabled=true;spin.textContent='滚动中…';const target=Math.floor(Math.random()*exchanges.length);const distance=(target-current+exchanges.length)%exchanges.length+exchanges.length*2;let step=0;function tick(){step++;setCurrent(current+1);const p=step/distance;const delay=10+Math.pow(p,2)*60;if(step%4===0)soundTick(p);if(step<distance)setTimeout(tick,delay);else{soundWin();busy=false;spin.disabled=false;spin.textContent='再抽一次';result.textContent=exchanges[current][0]}}tick()}
spin.addEventListener('click',choose);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();choose()}if(!busy&&e.code==='ArrowDown'){e.preventDefault();setCurrent(current+1)}if(!busy&&e.code==='ArrowUp'){e.preventDefault();setCurrent(current-1)}});addEventListener('resize',render);makeItems();
})();
</script></body></html>
